apiVersion: apps/v1
kind: Deployment
metadata:
  name: xgb-backend
  namespace: phishing-detection
  labels:
    app: xgb-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: xgb-backend
  template:
    metadata:
      labels:
        app: xgb-backend
    spec:
      containers:
        - name: model-server
          image: phishing-ai-chat:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "src/xgb_model_server.py"]
          env:
            - name: PORT
              value: "5072"
            - name: FLASK_ENV
              value: production
          ports:
            - containerPort: 5072
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: xgb-backend
  namespace: phishing-detection
  labels:
    app: xgb-backend
spec:
  selector:
    app: xgb-backend
  ports:
    - name: http
      port: 80
      targetPort: 5072
  type: ClusterIP
